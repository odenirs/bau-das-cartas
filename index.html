<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Baú das Cartas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg1: #efe6ff;
  --bg2: #d9c8ff;
  --ink: #2b1b4d;
  --ink-dim: #5d4a8a;
  --panel: rgba(255,255,255,.6);
  --line: rgba(60,30,120,.22);
  --slot: rgba(60,30,120,.10);
  --gold: #e4a92a;
  --gold-hi: #ffe08a;
  --btn-ink: #2a1500;
  --serif: "Cinzel", "Trajan Pro", Georgia, serif;
  --sans: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg1: #1a1236;
    --bg2: #0b0719;
    --ink: #f6ead0;
    --ink-dim: #b9a8e0;
    --panel: rgba(255,255,255,.05);
    --line: rgba(255,224,138,.22);
    --slot: rgba(255,255,255,.06);
  }
}
:root[data-theme="dark"] {
  --bg1: #1a1236;
  --bg2: #0b0719;
  --ink: #f6ead0;
  --ink-dim: #b9a8e0;
  --panel: rgba(255,255,255,.05);
  --line: rgba(255,224,138,.22);
  --slot: rgba(255,255,255,.06);
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
    background: linear-gradient(rgba(11,7,25,.55), rgba(11,7,25,.82)), url("img/fundo.jpg") center top / cover no-repeat fixed;
  background-color: var(--bg2);
  color: var(--ink);
  font-family: var(--sans);
  font-weight: 600;
  -webkit-tap-highlight-color: transparent;
}
main { max-width: 760px; margin: 0 auto; padding: 22px 18px 48px; overflow-x: hidden; overflow-x: clip; }
h1 {
  margin: 4px 0 6px;
  text-align: center;
  font-family: var(--serif);
  font-weight: 900;
  font-size: clamp(30px, 8vw, 46px);
  letter-spacing: .02em;
  color: var(--ink);
}
.sub { margin: 0; text-align: center; color: var(--ink-dim); font-size: 16px; }

/* ---------- palco do baú ---------- */
.stage {
  position: relative;
  display: grid;
  place-items: center;
  margin: 18px auto 6px;
  width: min(76vw, 340px);
  aspect-ratio: 423 / 481;
}
.rays {
  position: absolute;
  left: 50%; top: 56%;
  width: 190%; aspect-ratio: 1;
  translate: -50% -50%;
  background: repeating-conic-gradient(from 0deg, rgba(255,214,110,.55) 0 7deg, transparent 7deg 20deg);
  -webkit-mask-image: radial-gradient(circle, #000 0 14%, transparent 56%);
          mask-image: radial-gradient(circle, #000 0 14%, transparent 56%);
  opacity: 0;
  transition: opacity .5s ease;
  pointer-events: none;
  animation: spin 14s linear infinite;
}
.stage.open .rays { opacity: 1; }
@keyframes spin { to { rotate: 360deg; } }

#chest {
  position: relative;
  width: 100%;
  padding: 0;
  border: 0;
  background: none;
  cursor: pointer;
  filter: drop-shadow(0 14px 18px rgba(0,0,0,.35));
}
#chest:focus-visible { outline: 3px solid var(--gold); outline-offset: 6px; border-radius: 16px; }
#chest { display: grid; }
#chest img { grid-area: 1 / 1; display: block; width: 100%; height: auto; user-select: none; -webkit-user-drag: none; }
#chest .img-open { opacity: 0; transform-origin: 50% 100%; }
.open #chest .img-closed { opacity: 0; }
.open #chest .img-open { opacity: 1; animation: pop .45s cubic-bezier(.3,1.6,.5,1); }
@keyframes pop { from { transform: scale(.93); } to { transform: scale(1); } }

@keyframes shake {
  0%, 100% { transform: rotate(0) scale(1); }
  15% { transform: rotate(-4deg) scale(1.02); }
  30% { transform: rotate(4deg) scale(1.03); }
  45% { transform: rotate(-5deg) scale(1.04); }
  60% { transform: rotate(5deg) scale(1.04); }
  80% { transform: rotate(-2deg) scale(1.02); }
}
.hint {
  margin: 0;
  text-align: center;
  font-size: 17px;
  color: var(--ink-dim);
  min-height: 1.6em;
}

/* ---------- álbum ---------- */
.album { margin-top: 30px; padding: 18px 16px 20px; border: 1px solid var(--line); border-radius: 18px; background: var(--panel); }
.album-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.album h2 { margin: 0; font-family: var(--serif); font-size: 22px; font-weight: 700; }
.count { color: var(--ink-dim); font-size: 16px; }
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
@media (min-width: 560px) { .grid { gap: 12px; } }
.slot.soon { cursor: default; display: grid; place-items: center; border: 2px dashed var(--line); background: transparent; opacity: .55; }
.slot.soon span { font-size: 11px; font-weight: 800; color: var(--ink-dim); text-align: center; line-height: 1.2; }
.slot {
  position: relative;
  padding: 0;
  border: 0;
  border-radius: 8px;
  background: var(--slot);
  aspect-ratio: 2 / 3;
  overflow: hidden;
  cursor: pointer;
}
.slot:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.slot img { display: block; width: 100%; height: 100%; object-fit: cover; }
.slot.locked { cursor: default; display: grid; place-items: center; border: 2px dashed var(--line); background: transparent; }
.slot.locked span { font-family: var(--serif); font-size: 34px; font-weight: 900; color: var(--ink-dim); opacity: .7; }
.qty {
  position: absolute; right: 6px; bottom: 6px;
  min-width: 26px; padding: 2px 7px;
  border-radius: 999px;
  background: #1b1030; color: var(--gold-hi);
  font-size: 13px; font-weight: 800; text-align: center;
}
.reset { display: block; margin: 16px auto 0; padding: 8px 12px; border: 0; background: none; color: var(--ink-dim); font: inherit; font-size: 14px; text-decoration: underline; cursor: pointer; }
.reset:focus-visible { outline: 2px solid var(--gold); border-radius: 6px; }

/* ---------- revelação ---------- */
.reveal {
  position: fixed; inset: 0; z-index: 10;
  display: none;
  flex-direction: column; align-items: center; justify-content: center;
  gap: 18px;
  padding: calc(18px + env(safe-area-inset-top, 0px)) 18px calc(18px + env(safe-area-inset-bottom, 0px));
  background: radial-gradient(90% 70% at 50% 40%, rgba(60,30,120,.92), rgba(6,3,16,.96));
}
.reveal.show { display: flex; animation: fade .3s ease; }
@keyframes fade { from { opacity: 0; } }
.flip {
  --w: min(80vw, 360px, calc((100dvh - 190px) * .68));
  width: var(--w);
  aspect-ratio: 2 / 3;
  perspective: 1200px;
  position: relative;
  touch-action: none;
}
.tilt {
  position: absolute; inset: 0;
  transform-style: preserve-3d;
  transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg));
  transition: transform .18s ease-out;
  will-change: transform;
}
.card3d { position: absolute; inset: 0; transform-style: preserve-3d; }
.reveal.show.fresh .card3d { animation: rise 1.1s cubic-bezier(.2,.85,.25,1) both; }
@keyframes rise {
  0%   { transform: translateY(160px) scale(.35) rotateY(180deg); opacity: 0; }
  35%  { opacity: 1; }
  100% { transform: translateY(0) scale(1) rotateY(0); opacity: 1; }
}
.face { position: absolute; inset: 0; border-radius: 10px; overflow: hidden; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.front img { display: block; width: 100%; height: 100%; object-fit: cover; }
.front { isolation: isolate; }
.front::before, .front::after { content: ""; position: absolute; inset: 0; pointer-events: none; transition: opacity .25s ease; }
.front::before {
  z-index: 2;
  background: linear-gradient(125deg, #ff0080, #ffd000, #00ffb0, #00a0ff, #b000ff, #ff0080);
  background-size: 300% 300%;
  background-position: calc(var(--px, 50) * 1%) calc(var(--py, 50) * 1%);
  mix-blend-mode: color-dodge;
  opacity: calc(var(--o, 0) * .5);
}
.front::after {
  z-index: 3;
  background:
    radial-gradient(circle at calc(var(--px, 50) * 1%) calc(var(--py, 50) * 1%), rgba(255,255,255,.75), rgba(255,255,255,0) 42%),
    linear-gradient(115deg, transparent 30%, rgba(255,255,255,.22) 48%, transparent 66%);
  mix-blend-mode: soft-light;
  opacity: var(--o, 0);
}
.front { box-shadow: 0 0 0 2px rgba(255,224,138,.55), 0 0 60px rgba(255,200,80,.45), 0 24px 50px rgba(0,0,0,.6); }
.back {
  transform: rotateY(180deg);
  background:
    radial-gradient(circle at 50% 50%, #ffe08a 0 9%, #8a4a14 10% 12%, transparent 13%),
    repeating-radial-gradient(circle at 50% 50%, #5a2d10 0 8px, #7a4219 8px 16px);
  border: 6px solid #2a1550;
  display: grid; place-items: center;
}
.back span { font-family: var(--serif); font-weight: 900; font-size: 64px; color: #2a1550; }
.badge {
  position: absolute; z-index: 2; top: -10px; right: -8px;
  padding: 5px 12px;
  border-radius: 999px;
  background: linear-gradient(135deg, var(--gold-hi), var(--gold));
  color: var(--btn-ink);
  font-weight: 800; font-size: 14px;
  transform: rotate(6deg);
  box-shadow: 0 4px 10px rgba(0,0,0,.4);
}
.badge[hidden] { display: none; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.btn {
  min-height: 46px;
  padding: 11px 22px;
  border-radius: 999px;
  border: 2px solid var(--gold);
  font: inherit; font-weight: 800; font-size: 17px;
  cursor: pointer;
}
.btn.primary { background: linear-gradient(135deg, var(--gold-hi), var(--gold)); color: var(--btn-ink); }
.btn.ghost { background: transparent; color: #f6ead0; }
.btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
.btn:active { transform: translateY(1px); }

@media (prefers-reduced-motion: reduce) {
  .rays { animation: none; }
  .shake #chest { animation: none; }
  .open #chest .img-open { animation: none; }
  .burst, .flash { display: none; }
  .tilt { transition: none; }
  .reveal.show.fresh .card3d { animation: fade .3s ease both; }
}
</style>
</head>
<body>
<main>
  <h1>Baú das Cartas</h1>
  <p class="sub">Abra o baú e descubra qual carta do grupo vai sair.</p>

  <div class="stage" id="stage">
    <div class="rays" aria-hidden="true"></div>
    <button id="chest" type="button" aria-label="Abrir o baú">
      <img class="img-closed" src="img/bau-fechado.webp" alt="" draggable="false">
      <img class="img-open" src="img/bau-aberto.webp" alt="" draggable="false">
    </button>
  </div>
  <p class="hint" id="hint">Toque no baú</p>

  <section class="album" aria-labelledby="album-title">
    <div class="album-head">
      <h2 id="album-title">Álbum</h2>
      <span class="count" id="count"></span>
    </div>
    <div class="grid" id="grid"></div>
    <button class="reset" id="reset" type="button">Zerar álbum</button>
  </section>
</main>

<div class="reveal" id="reveal" role="dialog" aria-modal="true" aria-label="Carta sorteada">
  <div class="flip">
    <span class="badge" id="badge" hidden>Nova!</span>
      <div class="tilt">
      <div class="card3d">
        <div class="face back"><span>?</span></div>
        <div class="face front"><img id="revealImg" alt=""></div>
      </div>
    </div>
  </div>
  <div class="actions">
    <button class="btn primary" id="again" type="button">Abrir de novo</button>
    <button class="btn ghost" id="close" type="button">Fechar</button>
  </div>
</div>

<script>
// Para adicionar uma carta: salve a imagem na pasta cards/ e acrescente uma linha na lista abaixo.
// O id precisa ser único e nunca mudar (o álbum de cada pessoa usa ele).
const TOTAL_SLOTS = 20;
const CARDS = [
  { id: "coquinha", name: "Coquinha", src: "cards/coquinha.jpeg" },
  { id: "harrop", name: "Harrop", src: "cards/harrop.jpeg" },
  { id: "lule", name: "faça o L", src: "cards/lule.jpeg" },
  { id: "paulo", name: "Paulo", src: "cards/paulo.jpeg" },
  { id: "bike-fantasma", name: "bike fantasma roubada", src: "cards/bike fantasma.jpeg" },
  { id: "ciclista-fantasma", name: "ciclista da bike fantasma", src: "cards/ciclista fantasma.jpeg" },
  { id: "clovis", name: "betino o mestre das apostas", src: "cards/clovis.jpeg" },
  { id: "frango-brent", name: "Frango Brent, o Predileto", src: "cards/frango-brent.jpg" },
  { id: "happyvida", name: "Happyvida, o Fingidor de Plantão", src: "cards/happyvida.jpg" },
  { id: "lobichona", name: "Lobichona", src: "cards/lobichona.jpg" },
  { id: "mollynho", name: "Mollynho, o amiguinho da Dolly", src: "cards/mollynho.jpg" },
  { id: "moreia", name: "Deus Abissal: Moréia Gigante das Profundezas", src: "cards/moreia.jpg" },
  { id: "pikaxe", name: "Pikaxé, o Mago Profético", src: "cards/pikaxe.jpg" },
  { id: "poder-ilimitado", name: "Poder Ilimitado Porra", src: "cards/poder-ilimitado.jpg" },
  { id: "escudeiro", name: "Escudeiro da Defesa Impenetrável", src: "cards/escudeiro.jpg" },
  { id: "pote-calvice", name: "Pote da Calvice", src: "cards/pote-calvice.jpg" },
  { id: "drmamidia", name: "Dr. Mamídia", src: "cards/drmamidia.jpeg" },
  { id: "jacob", name: "Jacob", src: "cards/jacob.jpeg" },
  { id: "skol", name: "Skol", src: "cards/skol.jpeg" },
  { id: "srsacana", name: "Sr. Sacana", src: "cards/srsacana.jpeg" },
    { id: "banana-verde", name: "Banana Verde", src: "cards/banana verde.jpeg" },
  { id: "calota-peugeot", name: "Calota Peugeot", src: "cards/calota peugeot.jpeg" },
  { id: "calvos-house", name: "Calvo's House", src: "cards/calvos-house.jpeg" },
  { id: "cauda-da-moreia", name: "Cauda da Moreia", src: "cards/cauda da moreia.jpeg" },
  { id: "coin-street", name: "Coin Street", src: "cards/coin street.jpeg" },
  { id: "corpo-da-moreia", name: "Corpo da Moreia", src: "cards/corpo da moreia.jpeg" },
  { id: "feijoada-da-boa", name: "Feijoada da Boa", src: "cards/feijoada da boa.jpeg" },
  { id: "general-das-trevas", name: "General das Trevas", src: "cards/general das trevas.jpeg" },
  { id: "grade-de-skol", name: "Grade de Skol", src: "cards/grade de skol.jpeg" },
  { id: "sacanamovel", name: "Sacanamóvel", src: "cards/sacanamovel.jpeg" },
  { id: "short-demoniaco", name: "Short Demoníaco", src: "cards/short demoniaco.jpeg" },
  { id: "vai-meter-nao", name: "Vai Meter Não", src: "cards/vai meter não.jpeg" },
  { id: "vai-meter-sim", name: "Vai Meter Sim", src: "cards/vai meter sim.jpeg" },
];

const STORE_KEY = "bau-cartas-v1";
let owned = {};
try {
  const raw = localStorage.getItem(STORE_KEY);
  if (raw) owned = JSON.parse(raw) || {};
} catch (e) { owned = {}; }
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(owned)); } catch (e) {} }

const $ = (id) => document.getElementById(id);
const stage = $("stage"), chest = $("chest"), hint = $("hint");
const reveal = $("reveal"), revealImg = $("revealImg"), badge = $("badge");
const grid = $("grid"), count = $("count"), resetBtn = $("reset");
let busy = false, lastFocus = null, resetArmed = false;

function renderAlbum() {
  grid.textContent = "";
  let have = 0;
  CARDS.forEach((c) => {
    const n = owned[c.id] || 0;
    if (n > 0) {
      have++;
      const b = document.createElement("button");
      b.type = "button"; b.className = "slot";
      b.setAttribute("aria-label", "Ver carta " + c.name);
      const img = document.createElement("img");
      img.src = c.src; img.alt = c.name; img.loading = "lazy";
      b.appendChild(img);
      if (n > 1) { const q = document.createElement("span"); q.className = "qty"; q.textContent = "x" + n; b.appendChild(q); }
      b.addEventListener("click", () => showCard(c, false, false));
      grid.appendChild(b);
    } else {
      const d = document.createElement("div");
      d.className = "slot locked"; d.setAttribute("aria-label", "Carta ainda não encontrada");
      d.innerHTML = "<span>?</span>";
      grid.appendChild(d);
    }
  });
    for (let i = CARDS.length; i < TOTAL_SLOTS; i++) {
    const d = document.createElement("div");
    d.className = "slot soon";
    d.setAttribute("aria-label", "Espaço para uma carta futura");
    d.innerHTML = "<span>em<br>breve</span>";
    grid.appendChild(d);
  }
  count.textContent = have + " de " + CARDS.length;
}

function showCard(card, fresh, isNew) {
  lastFocus = document.activeElement;
    stopHolo();
  revealImg.src = card.src; revealImg.alt = card.name;
  badge.hidden = !(fresh && isNew);
  reveal.classList.toggle("fresh", fresh);
  reveal.classList.add("show");
  $(fresh ? "again" : "close").focus({ preventScroll: true });
  $("again").style.display = fresh ? "" : "none";
    if (fresh) lightFlash();
  startHolo(fresh);
}
function closeReveal() {
  stopHolo();
  reveal.classList.remove("show", "fresh");
  stage.classList.remove("open");
  hint.textContent = "Toque no baú";
  busy = false;
  if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true });
}
// Chance de a carta sorteada ser uma que a pessoa já tem.
// 0 = sorteio normal | 0.5 = metade das aberturas vem repetida
const CHANCE_REPETIDA = 0.5;

function sortearCarta() {
  const jaTem = CARDS.filter((c) => owned[c.id] > 0);
  if (jaTem.length > 0 && Math.random() < CHANCE_REPETIDA) {
    return jaTem[Math.floor(Math.random() * jaTem.length)];
  }
  return CARDS[Math.floor(Math.random() * CARDS.length)];
}
function openChest() {
  if (busy) return;
  busy = true;
  hint.textContent = "Abrindo…";
  stage.classList.add("shake");
  setTimeout(() => {
    stage.classList.remove("shake");
    stage.classList.add("open");
        burst();
    try { if (navigator.vibrate) navigator.vibrate(60); } catch (e) {}
  }, 700);
  setTimeout(() => {
    const card = sortearCarta();
    const isNew = !owned[card.id];
    owned[card.id] = (owned[card.id] || 0) + 1;
    save(); renderAlbum();
    showCard(card, true, isNew);
  }, 1350);
}
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const flip = reveal.querySelector(".flip");

function burst() {
  if (reduceMotion) return;
  const b = document.createElement("div");
  b.className = "burst";
  for (let i = 0; i < 16; i++) {
    const s = document.createElement("i");
    const a = Math.random() * Math.PI * 2;
    const d = 70 + Math.random() * 100;
    s.style.setProperty("--dx", (Math.cos(a) * d).toFixed(0) + "px");
    s.style.setProperty("--dy", (Math.sin(a) * d - 30).toFixed(0) + "px");
    s.style.setProperty("--s", (0.5 + Math.random() * 0.9).toFixed(2));
    s.style.animationDelay = (Math.random() * 0.12).toFixed(2) + "s";
    b.appendChild(s);
  }
  stage.appendChild(b);
  setTimeout(() => b.remove(), 1200);
}

function lightFlash() {
  if (reduceMotion) return;
  const f = document.createElement("div");
  f.className = "flash";
  document.body.appendChild(f);
  setTimeout(() => f.remove(), 800);
}

let sweepTimer = 0, sweepRaf = 0;
function applyHolo(x, y, strength) {
  x = Math.min(1, Math.max(0, x));
  y = Math.min(1, Math.max(0, y));
  flip.style.setProperty("--rx", ((0.5 - y) * 18).toFixed(2) + "deg");
  flip.style.setProperty("--ry", ((x - 0.5) * 22).toFixed(2) + "deg");
  flip.style.setProperty("--px", (x * 100).toFixed(1));
  flip.style.setProperty("--py", (y * 100).toFixed(1));
  flip.style.setProperty("--o", strength);
}
function endHolo() {
  flip.style.setProperty("--rx", "0deg");
  flip.style.setProperty("--ry", "0deg");
  flip.style.setProperty("--o", 0);
}
function cancelSweep() { clearTimeout(sweepTimer); cancelAnimationFrame(sweepRaf); }
function sweep() {
  const t0 = performance.now(), dur = 1500;
  const step = (t) => {
    const k = Math.min(1, (t - t0) / dur);
    applyHolo(0.15 + 0.7 * k, 0.25 + 0.5 * Math.sin(k * Math.PI), Math.sin(k * Math.PI));
    if (k < 1) sweepRaf = requestAnimationFrame(step); else endHolo();
  };
  sweepRaf = requestAnimationFrame(step);
}
function startHolo(fresh) {
  cancelSweep(); endHolo();
  if (reduceMotion) return;
  sweepTimer = setTimeout(sweep, fresh ? 1150 : 250);
}
function stopHolo() { cancelSweep(); endHolo(); }

flip.addEventListener("pointermove", (e) => {
  cancelSweep();
  const r = flip.getBoundingClientRect();
  applyHolo((e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height, 1);
});
flip.addEventListener("pointerleave", endHolo);
flip.addEventListener("pointercancel", endHolo);
flip.addEventListener("pointerup", (e) => { if (e.pointerType !== "mouse") endHolo(); });
chest.addEventListener("click", openChest);
$("again").addEventListener("click", () => {
  closeReveal();
  setTimeout(openChest, 250);
});
$("close").addEventListener("click", closeReveal);
reveal.addEventListener("click", (e) => { if (e.target === reveal) closeReveal(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && reveal.classList.contains("show")) closeReveal(); });

resetBtn.addEventListener("click", () => {
  if (!resetArmed) {
    resetArmed = true;
    resetBtn.textContent = "Toque de novo para apagar tudo";
    setTimeout(() => { resetArmed = false; resetBtn.textContent = "Zerar álbum"; }, 3500);
    return;
  }
  owned = {}; save(); renderAlbum();
  resetArmed = false; resetBtn.textContent = "Zerar álbum";
});

renderAlbum();
</script>
</body>
</html>
